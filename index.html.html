<script>
const game=document.getElementById('game'),keeper=document.getElementById('keeper'),scoreEl=document.getElementById('score'),missEl=document.getElementById('miss'),startScreen=document.getElementById('start'),endScreen=document.getElementById('end');let score=0,miss=0,running=false,balls=[],spawnTimer=null,last=0,raf=0;
function moveKeeper(x){const r=game.getBoundingClientRect();keeper.style.left=Math.max(12,Math.min(88,(x-r.left)/r.width*100))+'%'}
game.addEventListener('pointermove',e=>{if(running)moveKeeper(e.clientX)});game.addEventListener('pointerdown',e=>{if(running)moveKeeper(e.clientX)});
function reset(){balls.forEach(b=>b.el.remove());balls=[];score=0;miss=0;scoreEl.textContent=0;missEl.textContent=0;keeper.style.left='50%'}
function spawn(){if(!running)return;const el=document.createElement('div');el.className='ball';el.textContent=Math.random()<.82?'⚽':'🏀';const x=8+Math.random()*84;el.style.left=x+'%';el.style.top='-48px';game.appendChild(el);balls.push({el,x,y:-48,speed:2.3+Math.random()*1.5});}
function tick(t){if(!running)return;const rect=game.getBoundingClientRect(),kr=keeper.getBoundingClientRect();balls.forEach((b,i)=>{b.y+=b.speed;b.el.style.top=b.y+'px';const br=b.el.getBoundingClientRect();if(br.bottom>=kr.top+8&&br.top<kr.bottom&&br.right>kr.left+5&&br.left<kr.right-5){score++;scoreEl.textContent=score;b.el.remove();balls.splice(i,1)}else if(b.y>rect.height){miss++;missEl.textContent=miss;b.el.remove();balls.splice(i,1)}});if(score>=10){finish(true);return}if(miss>=5){finish(false);return}raf=requestAnimationFrame(tick)}
function start(){reset();startScreen.classList.add('hidden');endScreen.classList.add('hidden');running=true;spawnTimer=setInterval(spawn,850);raf=requestAnimationFrame(tick)}
function finish(won){running=false;clearInterval(spawnTimer);cancelAnimationFrame(raf);document.getElementById('endTitle').textContent='С ДНЁМ РОЖДЕНИЯ, ЛОШАРА ЕБАНАЯ! 🎉';document.getElementById('endText').textContent=won?'10 мячей поймал — хоть что-то в этой жизни умеешь! 😂⚽ Желаю здоровья, удачи и побольше побед!':'Даже мячи от тебя убегают, легенда! 😂 С днём рождения! Желаю здоровья, удачи и побольше побед. Попробуй ещё раз!';endScreen.classList.remove('hidden');if(won)confetti()}
function confetti(){const colors=['#ffcf42','#ff5b69','#71e5a3','#70c9ed','#d9a4ff'];for(let i=0;i<75;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*1.6+'s';c.style.transform='rotate('+Math.random()*360+'deg)';game.appendChild(c);setTimeout(()=>c.remove(),5200)}}
document.getElementById('startBtn').addEventListener('click',start);document.getElementById('againBtn').addEventListener('click',start);
</script></body></html>
